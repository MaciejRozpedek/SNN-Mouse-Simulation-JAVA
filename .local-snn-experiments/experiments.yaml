base_config: ../src/main/resources/config/SNNConfig.yaml
jar: ../target/snn-mouse-simulation-0.0.1-SNAPSHOT.jar
baseline_experiment: baseline

settings:
  duration_ms: 10000
  step_ms: 1
  burn_in_ms: 1000
  repeats: 10
  base_seed: 1
  port: 18080
  startup_timeout_seconds: 30
  benchmark_timeout_seconds: 600
  minimum_repeats: 10
  minimum_stable_run_ratio: 0.8
  firing_rate_min_hz: 0.1
  firing_rate_max_hz: 50.0

experiments:
  - name: baseline
    overrides: []

  - name: weaker-layer1-layer2
    enabled: false
    overrides:
      - path: connections[2].weight.normal.mean
        value: 4.0
      - path: connections[2].weight.normal.std
        value: 1.3

  - name: stronger-sensory-current
    enabled: false
    overrides:
      - path: inputs[0].params.max_current
        value: 12.0

  - name: baseline-without-learning
    enabled: false
    benchmark_settings:
      learning_enabled: false
    overrides: []
