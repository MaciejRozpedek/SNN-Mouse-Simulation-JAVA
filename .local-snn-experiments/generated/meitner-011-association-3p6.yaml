# MEITNER 011 — Poincare001 z umiarkowana bramka asocjacyjna I=3.6.
# HIPOTEZA I POWOD: redukcja autonomicznego firing Layer2 moze zwiekszyc headroom
# i selektywnosc DA-STDP bardziej niz minimalna zmiana 010, nadal zachowujac
# propagacje dla silnych i skorelowanych bodzcow vision.
# MECHANIZM MATEMATYCZNY: dla I=3.6 luka stabilny punkt–separator to
# 10*sqrt(0.4)=6.325 mV, wiec pojedyncze one_to_one w=5 nie wystarcza z idealnego
# spoczynku. Bodziec musi wspoldzialac z lokalnym E albo wczesniejsza depolaryzacja.
# Wszystkie E/I, prady poza AssociationBias, action weights, outputs i DA-STDP sa
# jak w P001. Mniej nieprzyczynowych post-spike'ow powinno poprawic stosunek
# causal eligibility do tla, ale zbyt silna bramka moze obnizyc liczbe par STDP.
# ROZNICA WOBEC BASELINE: wobec archiwalnego P001 jedyna zmiana to 3.8 -> 3.6;
# wobec 010 jest to ta sama jednowymiarowa rodzina 3.7 -> 3.6. Ten sam YAML nalezy
# uruchamiac true/frozen i learn->freeze; flag faz nie wpisywac do konfiguracji.
# OCZEKIWANY WYNIK: frozen slabszy od 010, lecz ruch w >=90% seedow; learning
# odzyskuje czesc wyniku i daje wieksze true-frozen/retention niz P001 bez spadku
# true rewards o >10%. Post-freeze wagi pozostaja stale, a efekt utrzymuje sie.
# METRYKI: jak 010; dodatkowo interakcja (true-frozen)_011-(true-frozen)_P001,
# rate Layer2 RS, sensory-locked spike fraction, eligibility per projekcja i
# post-freeze first/second half rewards.
# KRYTERIUM ODRZUCENIA: true rewards <90% P001, frozen lub true z >10% bez ruchu,
# niestabilny firing, interaction <=0, rewards/1000 path gorsze albo brak retencji.
# Nie uruchamiac przed bazowym P001 train->freeze i nie uzywac seedow 104729+.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}
groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons: [{type: RS, count: 80}, {type: FS, count: 20}]
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
          - name: VisualCenter
            neurons: [{type: RS, count: 40}, {type: FS, count: 10}]
          - name: VisualPositive
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
          - name: Forward
            neurons: [{type: RS, count: 40}, {type: FS, count: 10}]
          - name: PositiveTurn
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 6.0}
  - name: AssociationBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer2
    target_type: RS
    params: {base_current: 3.6, noise_std: 0.0}
  - name: ActionBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer3
    target_type: RS
    params: {base_current: 3.5, noise_std: 0.0}
outputs:
  - name: RotateNegative
    output_type: TURN_RIGHT
    source_group: Cortex.Layer3.NegativeTurn
    source_type: RS
    params: {radians_per_spike: 0.02}
  - name: RotatePositive
    output_type: TURN_LEFT
    source_group: Cortex.Layer3.PositiveTurn
    source_type: RS
    params: {radians_per_spike: 0.02}
  - name: MoveForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Layer3.Forward
    source_type: RS
    params: {speed_per_spike: 0.05}
connections:
  - {from: Cortex.Layer1, to: Cortex.Layer1, from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: 'Cortex.Layer2.[0]', to: 'Cortex.Layer2.[0]', from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: 'Cortex.Layer3.[0]', to: 'Cortex.Layer3.[0]', from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: Cortex.Layer1, to: Cortex.Layer1, from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: 'Cortex.Layer2.[0]', to: 'Cortex.Layer2.[0]', from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: 'Cortex.Layer3.[0]', to: 'Cortex.Layer3.[0]', from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: Cortex.Layer1, to: Cortex.Layer2, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 5.0}, rule: {type: one_to_one, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualNegative, to: Cortex.Layer3.NegativeTurn, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualCenter, to: Cortex.Layer3.Forward, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualPositive, to: Cortex.Layer3.PositiveTurn, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
