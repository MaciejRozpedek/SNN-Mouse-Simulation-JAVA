# MEITNER 012 — Poincare001 z silna sensoryczna bramka asocjacyjna I=3.5.
# HIPOTEZA I POWOD: ustawienie Layer2 na ten sam podprogowy bias 3.5 co Layer3
# maksymalnie usuwa autonomiczne tlo P001 w testowanym zakresie i sprawdza, czy
# DA-STDP potrafi budowac polityke z bardziej bodzcowo-zaleznej aktywnosci.
# MECHANIZM MATEMATYCZNY: dla I=3.5 luka stabilny punkt–separator to
# 10*sqrt(0.5)=7.071 mV; w=5 samo nie przekracza luki. Potrzebna jest kooperacja
# vision, lokalnego E lub wyuczonej potencjacji. Parametry E/I, action bias=3.5,
# wagi akcji=4 i routing pozostaja jak P001. Mniej spike'ow zmniejsza szum credit,
# ale moze tez zbyt silnie ograniczyc firing, eligibility i propagacje do akcji.
# ROZNICA WOBEC BASELINE: wobec archiwalnego P001 jedyna zmiana to AssociationBias
# 3.8 -> 3.5; wobec 010/011 jest to trzeci punkt tej samej rodziny. Flagi learning
# i freeze pozostaja poza YAML i wszystkie ramiona musza archiwizowac ten sam plik.
# OCZEKIWANY WYNIK: wariant graniczny; frozen moze byc slabszy, true powinno
# odzyskac wynik tylko jesli plastycznosc wzmacnia causal sciezki. Udana retencja
# dalaby najczystszy dowod sensorycznie bramkowanego credit assignment z serii.
# METRYKI: frozen/true/learn->freeze jak 010/011, sensory-locked Layer2 rate,
# postFreezeRewards, rewards/1000 path, stable firing, wagi i eligibility per tor.
# KRYTERIUM ODRZUCENIA: >10% cichych/nieruchomych runow, true <90% P001, brak
# dodatniej interaction true-frozen, CI retencji obejmujace zero, zanik efektu w
# drugiej polowie post-freeze lub niestabilny firing. Test dopiero po phase P001.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}
groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons: [{type: RS, count: 80}, {type: FS, count: 20}]
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
          - name: VisualCenter
            neurons: [{type: RS, count: 40}, {type: FS, count: 10}]
          - name: VisualPositive
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
          - name: Forward
            neurons: [{type: RS, count: 40}, {type: FS, count: 10}]
          - name: PositiveTurn
            neurons: [{type: RS, count: 20}, {type: FS, count: 5}]
inputs:
  - {name: VisionFront, sensor_type: GAUSSIAN_VISION, target_group: Cortex.Layer1, target_type: RS, params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 6.0}}
  - {name: AssociationBias, sensor_type: TONIC_NOISE, target_group: Cortex.Layer2, target_type: RS, params: {base_current: 3.5, noise_std: 0.0}}
  - {name: ActionBias, sensor_type: TONIC_NOISE, target_group: Cortex.Layer3, target_type: RS, params: {base_current: 3.5, noise_std: 0.0}}
outputs:
  - {name: RotateNegative, output_type: TURN_RIGHT, source_group: Cortex.Layer3.NegativeTurn, source_type: RS, params: {radians_per_spike: 0.02}}
  - {name: RotatePositive, output_type: TURN_LEFT, source_group: Cortex.Layer3.PositiveTurn, source_type: RS, params: {radians_per_spike: 0.02}}
  - {name: MoveForward, output_type: FORWARD_DRIVE, source_group: Cortex.Layer3.Forward, source_type: RS, params: {speed_per_spike: 0.05}}
connections:
  - {from: Cortex.Layer1, to: Cortex.Layer1, from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: 'Cortex.Layer2.[0]', to: 'Cortex.Layer2.[0]', from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: 'Cortex.Layer3.[0]', to: 'Cortex.Layer3.[0]', from_type: RS, to_type: all, exclude_self: false, weight: {uniform: {min: 0.5, max: 1.0}}, rule: {type: probabilistic, probability: 0.08, allow_autapses: true}}
  - {from: Cortex.Layer1, to: Cortex.Layer1, from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: 'Cortex.Layer2.[0]', to: 'Cortex.Layer2.[0]', from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: 'Cortex.Layer3.[0]', to: 'Cortex.Layer3.[0]', from_type: FS, to_type: RS, exclude_self: false, weight: {fixed: -2.0}, rule: {type: fixed_out_degree, count: 10, allow_autapses: false}}
  - {from: Cortex.Layer1, to: Cortex.Layer2, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 5.0}, rule: {type: one_to_one, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualNegative, to: Cortex.Layer3.NegativeTurn, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualCenter, to: Cortex.Layer3.Forward, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
  - {from: Cortex.Layer2.VisualPositive, to: Cortex.Layer3.PositiveTurn, from_type: RS, to_type: RS, exclude_self: false, weight: {fixed: 4.0}, rule: {type: fixed_in_degree, count: 4, allow_autapses: false}}
