# POINCARE 007 — nizszy bias Layer2 dla czystszego credit assignment.
# HIPOTEZA: P001 replikuje efekt learning-frozen +10.65%, ale Layer2 bias=3.8
#   lezy na granicy stabilnosci RS i tworzy tonic eligibility. Obnizenie do 3.6
#   oslabia frozen prior, za to powinno zwiekszyc sensoryczna specyficznosc DA-STDP.
# MECHANIZM MATEMATYCZNY: dyskretna granica RS przy dt=1 ms wynosi ok. 3.7984.
#   I=3.6 ma stabilny punkt podprogowy; spike Layer2 wymaga wejscia one_to_one
#   wagi 5 lub lokalnej paczki E. Layer3 pozostaje na bias=3.5, a kazdy neuron
#   akcji ma fan-in 4 i wage 4. E/I, liczba krawedzi, vision, output i stale
#   DA-STDP sa identyczne z 001. Mniej tonic spike'ow powinno zmniejszyc przypadkowe
#   eligibility i poprawic stosunek sygnalu nagrody do szumu credit assignment.
# ROZNICA WZGLEDEM BASELINE: rzadka topografia i jawne akcje jak P001.
#   Wzgledem P001 jedyna zmiana funkcjonalna to AssociationBias 3.8 -> 3.6.
# OCZEKIWANY WYNIK: FF ma nieco mniej rewards niz frozen P001, lecz zachowuje ruch
#   i poprawny znak. TF daje wiekszy względny efekt retencji niz P001 bez wzrostu
#   drogi, saturacji albo niestabilnosci firing; TT nie jest potrzebne do podtrzymania.
# METRYKI: trzy ramiona FF/TF/TT; post-freeze rewards, trend, pathLength,
#   rewards/1000 drogi, firing, wagi initial/freeze/final, surowe pary i bootstrap
#   TF-FF; kontrolowany assay znaku dla +/-45 stopni przed drogim phase testem.
# KRYTERIUM ODRZUCENIA: odrzucic przed phase testem, jesli assay traci poprawny
#   znak lub >10% frozen runow nie porusza sie. Odrzucic hipoteze uczenia, gdy
#   mean/mediana TF-FF <=0, CI obejmuje zero, efekt jest slabszy od P001 albo
#   wynika tylko z drogi; Delta w po freeze musi byc 0 w TF/FF.
# PHASE PROTOCOL: najpierw dokonczyc P001. Potem duration=300000, freeze=180000,
#   measurementStart/burnIn=185000, repeats=30, step=1, nowy baseSeed; uruchomic
#   always-frozen, train-then-freeze i continuous-learning na identycznych seedach.
# UWAGA: learningEnabled i freezeLearningAtMs sa parametrami runnera, nie YAML.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisualCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisualPositive
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: PositiveTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 6.0
  - name: AssociationBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer2
    target_type: RS
    params:
      base_current: 3.6
      noise_std: 0.0
  - name: ActionBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer3
    target_type: RS
    params:
      base_current: 3.5
      noise_std: 0.0

# Rotacje sa wykonywane przed ruchem, aby przy wspolnej aktywnosci agent najpierw
# zmienil orientacje, a dopiero potem przesunal sie w nowym kierunku.
outputs:
  - name: RotateNegative
    output_type: TURN_RIGHT
    source_group: Cortex.Layer3.NegativeTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: RotatePositive
    output_type: TURN_LEFT
    source_group: Cortex.Layer3.PositiveTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: MoveForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Layer3.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 5.0
    rule:
      type: one_to_one
      allow_autapses: false
  - from: Cortex.Layer2.VisualNegative
    to: Cortex.Layer3.NegativeTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualCenter
    to: Cortex.Layer3.Forward
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualPositive
    to: Cortex.Layer3.PositiveTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
