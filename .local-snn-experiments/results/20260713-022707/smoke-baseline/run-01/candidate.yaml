neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0
groups:
- name: Cortex
  subgroups:
  - name: Layer1
    neurons:
    - type: RS
      count: 80
    - type: FS
      count: 20
  - name: Layer2
    neurons:
    - type: RS
      count: 80
    - type: FS
      count: 20
  - name: Layer3
    neurons:
    - type: RS
      count: 80
    - type: FS
      count: 20
inputs:
- name: VisionFront
  sensor_type: GAUSSIAN_VISION
  target_group: Cortex.Layer1
  target_type: RS
  params:
    fov: 120
    range: 500
    overlap_factor: 1.5
    max_current: 10.0
outputs:
- name: MotorControl
  output_type: POPULATION_DRIVE
  source_group: Cortex.Layer3
  source_type: RS
  params:
    speed_per_spike: 0.1
    turn_factor: 0.1
connections:
- from: Cortex.[0]
  to: Cortex.[0]
  from_type: RS
  to_type: all
  exclude_self: false
  weight:
    uniform:
      min: 1.0
      max: 2.0
  rule:
    type: probabilistic
    probability: 0.1
    allow_autapses: true
- from: Cortex.[0]
  to: Cortex.[0]
  from_type: FS
  to_type: RS
  exclude_self: false
  weight:
    fixed: -2.0
  rule:
    type: fixed_out_degree
    count: 15
    allow_autapses: false
- from: Cortex.Layer1
  to: Cortex.Layer2
  from_type: RS
  to_type: all
  weight:
    normal:
      mean: 6
      std: 2
  rule:
    type: all_to_all
    allow_autapses: false
- from: Cortex.Layer2
  to: Cortex.Layer3
  from_type: RS
  to_type: all
  weight:
    normal:
      mean: 3.0
      std: 1.0
  rule:
    type: probabilistic
    probability: 0.25
    allow_autapses: false
