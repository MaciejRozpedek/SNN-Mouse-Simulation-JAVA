# POINCARE 001 — topograficzne akcje: obrot, potem ruch naprzod.
# HIPOTEZA: zachowanie znaku kata na calej drodze sensorycznej oraz jawne populacje
#   obrotu ujemnego, ruchu naprzod i obrotu dodatniego dadza stabilniejsza polityke
#   poszukiwania pokarmu niz losowo mieszajacy baseline.
# MECHANIZM MATEMATYCZNY: Layer1 RS koduje kat od -60 do +60 stopni. Projekcja
#   one_to_one zachowuje kolejnosc w Layer2 (20 negative, 40 center, 20 positive).
#   Kazdy neuron akcji dostaje dokladnie 4 wejscia feed-forward; lokalne E ma p=0.08,
#   a FS daje po 10 wyjsc o wadze -2. Bias Layer2=3.8 lezy na granicy firingu
#   RS dla dt=1 ms, a bias akcji Layer3=3.5 pozostaje podprogowy. W ten sposob
#   warstwa asocjacyjna przekazuje sygnal, ale akcje wymagaja wejscia synaptycznego.
#   Dodatnie synapsy pozostaja plastyczne DA-STDP; rzadka mapa ogranicza globalne
#   credit assignment do sciezek zgodnych z kanalem kata.
# ROZNICA WZGLEDEM BASELINE: brak 8000 polaczen all_to_all o sredniej wadze 6,
#   brak losowej projekcji do jednego motoru i brak legacy POPULATION_DRIVE.
#   Vision max_current spada z 10 do 6; wyjscia sa trzema osobnymi populacjami.
# OCZEKIWANY WYNIK: obiekt boczny najpierw wywoluje obrot zgodnego znaku, a po
#   przejsciu do centralnych kanalow uruchamia ruch naprzod; mniej lawin i biasu.
# METRYKI: evaluationRewards (glowna, sparowana po seedzie), rewardTrend,
#   pathLength, finalFiringRateHz, averageWeightDelta; dodatkowo test lustrzany
#   znaku obrotu dla +/- kata i rewards na 1000 jednostek drogi.
# KRYTERIUM ODRZUCENIA: mediana final firing <0.1 Hz lub >50 Hz, brak ruchu w >10%
#   runow, bledny znak odpowiedzi lustrzanej albo brak dodatniej sparowanej roznicy
#   nagrod wzgledem baseline w screeningu 16 seedow.
# UWAGA LOADERA: w aktualnym kodzie allow_autapses=true odrzuca self-edge (semantyka
#   jest odwrocona wzgledem dokumentacji); wartosc ponizej celuje w aktualny benchmark.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisualCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisualPositive
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: PositiveTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 6.0
  - name: AssociationBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer2
    target_type: RS
    params:
      base_current: 3.8
      noise_std: 0.0
  - name: ActionBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer3
    target_type: RS
    params:
      base_current: 3.5
      noise_std: 0.0

# Rotacje sa wykonywane przed ruchem, aby przy wspolnej aktywnosci agent najpierw
# zmienil orientacje, a dopiero potem przesunal sie w nowym kierunku.
outputs:
  - name: RotateNegative
    output_type: TURN_RIGHT
    source_group: Cortex.Layer3.NegativeTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: RotatePositive
    output_type: TURN_LEFT
    source_group: Cortex.Layer3.PositiveTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: MoveForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Layer3.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 5.0
    rule:
      type: one_to_one
      allow_autapses: false
  - from: Cortex.Layer2.VisualNegative
    to: Cortex.Layer3.NegativeTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualCenter
    to: Cortex.Layer3.Forward
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualPositive
    to: Cortex.Layer3.PositiveTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
