# HOOKE 001 — jawne akcje, losowy most sensoryczny (kontrola strukturalna)
# Hipoteza: samo rozdzielenie wyjść na TurnLeft/Forward/TurnRight nie wystarczy;
# losowy most Sensory->Motor powinien dać eksplorację, lecz słabą zgodność kąta
# celu z akcją i duży rozrzut wyników między seedami.
# Mechanizm matematyczny:
# - N=200: 160 RS i 40 FS (E/I neuronów 80/20).
# - Lokalne E: oczekiwane 584 synapsy RS->all, wagi U(0.5,1.0).
# - Lokalne I: dokładnie 200 synaps FS->RS o wadze -2.5.
# - Most E: dokładnie 640 synaps (8 wejść na każdy z 80 RS motoru) o wadze 2.0.
# - Vision daje uporządkowany kod -60..+60 stopni; most losuje z całych 80 RS,
#   więc niszczy znak kąta przed jawnymi kanałami akcji.
# - Średnie tonic 1.5 w sensoryce i 2.0 w motorze są pod progiem ok. 3.8,
#   ale gaussowski ogon N(0,0.5/0.7), vision i synapsy mogą wywoływać spike'i.
# - Hunger po 5 s rampuje Forward do +3 w 20 s i resetuje się po nagrodzie,
#   zapewniając eksplorację, ale symetrycznie względem skrętów.
# - Propagacja Sensory->Motor trwa jeden krok, więc pary pre-post mieszczą się
#   w tau_STDP=5 ms; tau_c=1000 ms przenosi ich credit do kolizji z jedzeniem.
# - Globalne D-B może wzmacniać tylko te losowe drogi, które przypadkiem poprzedzą
#   nagrodę; ujemny ogon po ok. 51 ms może depresjonować aktywność post-reward.
# Różnica względem baseline: 200 zamiast 300 neuronów, jawne trzy akcje, fan-in 8
# zamiast pełnego 80, mniejsze prądy i wagi, reprodukowalny szum oraz Hunger.
# Oczekiwany wynik: umiarkowany ruch i firing, ale słaby steering gain, wysoki
# mirror error i wyniki gorsze od 002; ewentualny dodatni rewardTrend ma pokazać,
# czy DA-STDP potrafi wydobyć kontyngencję z losowego mostu.
# Metryki: evaluationRewards, rewardTrend, rewards/pathLength, firing rate,
# averageWeightDelta; po rozszerzeniu diagnostyki także wagi per projekcja,
# saturacja 0/50, b0, mirror error i steering gain.
# Kryterium odrzucenia: >25% runów z firing <0.1 Hz lub >50 Hz; brak ruchu w >10%;
# mediana rewards=0 po burn-in; |b0|>0.25 albo mirror error>0.25; >10% dodatnich
# wag na granicy 0/50. Porównywać parami z 002 i 003 na tych samych seedach.
# Zalecany screening: durationMs=180000, burnInMs=30000, stepMs=1,
# repeats=16, baseSeed=104729. Ten YAML jest kontrolą, nie samodzielnym dowodem
# uczenia bez wariantu frozen/no-dopamine.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Sensory
        subgroups:
          - name: VisionLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisionCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisionRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Motor
        subgroups:
          - name: TurnLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: TurnRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: OrderedVision
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Sensory
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 8.0

  - name: SensoryBackground
    sensor_type: TONIC_NOISE
    target_group: Cortex.Sensory
    target_type: RS
    params:
      base_current: 1.5
      noise_std: 0.5
      seed: 61001

  - name: MotorExploration
    sensor_type: TONIC_NOISE
    target_group: Cortex.Motor
    target_type: RS
    params:
      base_current: 2.0
      noise_std: 0.7
      seed: 62001

  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Motor.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 3.0

outputs:
  - name: ExplicitTurnLeft
    output_type: TURN_LEFT
    source_group: Cortex.Motor.TurnLeft
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitTurnRight
    output_type: TURN_RIGHT
    source_group: Cortex.Motor.TurnRight
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Motor.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: RS
    to_type: all
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.1
      # Loader ma odwróconą semantykę: true faktycznie blokuje autapsy.
      allow_autapses: true

  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: FS
    to_type: RS
    weight:
      fixed: -2.5
    rule:
      type: fixed_out_degree
      count: 5
      allow_autapses: false

  - from: Cortex.Sensory
    to: Cortex.Motor
    from_type: RS
    to_type: RS
    weight:
      fixed: 2.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false
