# HOOKE 002 — jawne akcje, słaby most zgodny z kątem (kandydat)
# Hipoteza: symetryczny prior VisionLeft->TurnRight, VisionCenter->Forward i
# VisionRight->TurnLeft zachowa znak kąta, a DA-STDP będzie dostrajać drogę, której
# opóźnienie pre-post wynosi jeden krok, zamiast odkrywać routing od zera.
# Mechanizm matematyczny:
# - N=200: 160 RS i 40 FS (E/I neuronów 80/20).
# - Lokalne E: oczekiwane 584 synapsy RS->all, wagi U(0.5,1.0).
# - Lokalne I: dokładnie 200 synaps FS->RS o wadze -2.5.
# - Most E: dokładnie 640 synaps, jak w 001: każdy RS motoru ma 8 wejść o wadze
#   2.0, lecz wyłącznie z odpowiadającego sektora sensorycznego.
# - Ujemny kąt uruchamia TURN_RIGHT (ujemny obrót), dodatni TURN_LEFT, a centrum
#   FORWARD. Odbicie zamienia lewe/prawe grupy bez zmiany liczby i wag krawędzi.
# - Prądy, firing, Hunger i zyski wyjścia są identyczne z 001; jedynym czynnikiem
#   jest informacja strukturalna w routingu.
# - Jeden krok propagacji mieści się w tau_STDP=5 ms. Causal eligibility z drogi
#   poprawnej akcji trwa tau_c=1000 ms i przy nagrodzie dostaje dodatni płat D-B.
#   Oczekuje się selektywnego wzrostu użytecznych wag bez globalnej lawiny.
# Różnica względem baseline: jawne akcje, ośmiokrotnie mniejszy fan-in niż pełne
# Layer1->Layer2, zachowana mapa trzech sektorów, łagodniejsze wagi/prądy i
# reprodukowalne źródła eksploracji.
# Oczekiwany wynik: przeciwny skręt dla bodźców lustrzanych, mniejsza wariancja
# seedów i więcej rewards/pathLength niż 001 i antyzgodny 003. RewardTrend powinien
# pozostać dodatni także po odjęciu trendu 001; wysoki wynik od pierwszej chwili
# oznacza jednak prior, nie dowód uczenia.
# Metryki: jak 001, z naciskiem na sparowane różnice 002-001 i 002-003, krzywe
# nagród w oknach, b0, mirror error, steering gain oraz zmiany wag trzech mostów.
# Kryterium odrzucenia: kryteria aktywności/saturacji z 001; dodatkowo brak
# poprawnego znaku steering gain, mirror error>0.15, mediana sparowanej różnicy
# rewards względem 001 <=0 albo efekt pochodzący z jednego seeda.
# Zalecany screening: durationMs=180000, burnInMs=30000, stepMs=1,
# repeats=16, baseSeed=104729; potwierdzenie na 30 nowych seedach. Do formalnego
# dowodu uczenia nadal potrzebna jest zamrożona ewaluacja/no-plasticity.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Sensory
        subgroups:
          - name: VisionLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisionCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisionRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Motor
        subgroups:
          - name: TurnLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: TurnRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: OrderedVision
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Sensory
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 8.0

  - name: SensoryBackground
    sensor_type: TONIC_NOISE
    target_group: Cortex.Sensory
    target_type: RS
    params:
      base_current: 1.5
      noise_std: 0.5
      seed: 61001

  - name: MotorExploration
    sensor_type: TONIC_NOISE
    target_group: Cortex.Motor
    target_type: RS
    params:
      base_current: 2.0
      noise_std: 0.7
      seed: 62001

  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Motor.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 3.0

outputs:
  - name: ExplicitTurnLeft
    output_type: TURN_LEFT
    source_group: Cortex.Motor.TurnLeft
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitTurnRight
    output_type: TURN_RIGHT
    source_group: Cortex.Motor.TurnRight
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Motor.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: RS
    to_type: all
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.1
      # Loader ma odwróconą semantykę: true faktycznie blokuje autapsy.
      allow_autapses: true

  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: FS
    to_type: RS
    weight:
      fixed: -2.5
    rule:
      type: fixed_out_degree
      count: 5
      allow_autapses: false

  - from: Cortex.Sensory.VisionLeft
    to: Cortex.Motor.TurnRight
    from_type: RS
    to_type: RS
    weight:
      fixed: 2.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionCenter
    to: Cortex.Motor.Forward
    from_type: RS
    to_type: RS
    weight:
      fixed: 2.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionRight
    to: Cortex.Motor.TurnLeft
    from_type: RS
    to_type: RS
    weight:
      fixed: 2.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false
