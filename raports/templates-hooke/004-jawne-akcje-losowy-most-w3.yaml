# HOOKE 004 — jawne akcje, losowy most o wadze 3 (kontrola strukturalna)
# Hipoteza: po przekroczeniu progu propagacji zwiększenie wagi nie stworzy znaku
# kąta w losowym routingu; 004 kontroluje, czy poprawa 005 wynika tylko z firingu.
# Mechanizm matematyczny:
# - N=200 (160 RS, 40 FS), oczekiwane lokalne E=584, dokładne I=200.
# - Most ma dokładnie 640 dodatnich synaps: fan-in 8, waga 3.0.
# - Przy tonicznym I=2 odległość stabilny punkt–separator to ok. 14.14 mV.
#   Losowy most wzmacnia propagację, ale miesza VisionLeft/Center/Right przed akcją.
# - Tonic, vision, Hunger, E/I, wyjścia i DA-STDP są identyczne z 005/006.
# - Causal pary pre-post nadal wpadają w 5 ms, a eligibility trwa 1000 ms;
#   globalne D-B nie zna jednak znaku kąta poza lokalną historią losowych krawędzi.
# Różnica względem baseline: jawne akcje, 200 neuronów i fan-in 8 zamiast pełnego
# miksera; względem 001 jedyną zmianą jest waga mostu 2.0 -> 3.0.
# Oczekiwany wynik: większy firing/ruch niż 001, lecz słaby steering gain i gorsza
# efektywność nagród niż 005; brak systematycznego znaku dla pojedynczego celu.
# Metryki: evaluationRewards, rewardTrend, rewards/1000 drogi, firing, delta wag,
# sign success dla +/-45 stopni, mean signed turn, mirror error i saturacja 0/50.
# Kryterium odrzucenia: firing >50 Hz, >10% wag na 0/50 lub brak ruchu w >10%;
# jako kontrola 004 zawodzi, jeśli bez uczenia osiąga steering sign >=75% albo
# dorównuje 005 w znaku i efektywności na większości sparowanych seedów.
# Screening: najpierw assay 16 seedów, cel 100 i 250 jednostek; potem 60 s x 8,
# a dopiero następnie durationMs=180000, burnInMs=30000, repeats=16, stepMs=1.
# Stan: loader/Agent OK; w dwóch blokach 8x60 s kontrola pozostała słabsza od 005.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Sensory
        subgroups:
          - name: VisionLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisionCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisionRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Motor
        subgroups:
          - name: TurnLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: TurnRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: OrderedVision
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Sensory
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 8.0

  - name: SensoryBackground
    sensor_type: TONIC_NOISE
    target_group: Cortex.Sensory
    target_type: RS
    params:
      base_current: 1.5
      noise_std: 0.5
      seed: 61001

  - name: MotorExploration
    sensor_type: TONIC_NOISE
    target_group: Cortex.Motor
    target_type: RS
    params:
      base_current: 2.0
      noise_std: 0.7
      seed: 62001

  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Motor.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 3.0

outputs:
  - name: ExplicitTurnLeft
    output_type: TURN_LEFT
    source_group: Cortex.Motor.TurnLeft
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitTurnRight
    output_type: TURN_RIGHT
    source_group: Cortex.Motor.TurnRight
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Motor.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: RS
    to_type: all
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.1
      # Loader ma odwróconą semantykę: true faktycznie blokuje autapsy.
      allow_autapses: true

  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: FS
    to_type: RS
    weight:
      fixed: -2.5
    rule:
      type: fixed_out_degree
      count: 5
      allow_autapses: false

  - from: Cortex.Sensory
    to: Cortex.Motor
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false
