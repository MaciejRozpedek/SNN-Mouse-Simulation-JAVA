# HOOKE 005 — jawne akcje, zgodny most o minimalnej skutecznej wadze 3
# Hipoteza: minimalne podniesienie mostu 2.0 -> 3.0 przekroczy próg propagacji
# pojedynczego celu, zachowując margines przed lawiną i selektywne eligibility.
# Mechanizm matematyczny:
# - N=200 (160 RS, 40 FS), oczekiwane lokalne E=584, dokładne I=200.
# - Most ma dokładnie 640 synaps: każdy RS akcji ma 8 wejść o wadze 3.0 z
#   właściwego sektora: left->TurnRight, center->Forward, right->TurnLeft.
# - Przy tonicznym I=2 luka stabilny punkt–separator wynosi ok. 14.14 mV.
#   In-memory sweep celu odległego o 100 dał dla w=2 znak 4/16 i dla w=3 znak
#   16/16, mean signed turn 0.099 rad; w=4+ nie poprawiało trafności znaku.
# - Vision+tonic ustawia sensorykę blisko progu 3.8; skorelowana paczka przechodzi
#   w jednym kroku, tworząc dodatnie causal eligibility w oknie STDP 5 ms.
# - Eligibility 1000 ms wiąże ścieżkę z nagrodą, a sparse routing ogranicza zasięg
#   globalnego D-B; ujemny ogon po nagrodzie pozostaje kontrolowany przez 004/006.
# Różnica względem baseline: jawne trzy akcje, bezpośrednia mapa kąta, fan-in 8,
# słabsze prądy i 640 zamiast 8000 silnych krawędzi feed-forward.
# Różnica względem 002: wyłącznie fixed bridge weight 2.0 -> 3.0.
# Oczekiwany wynik: niezawodny znak skrętu dla bliskiego celu, wyższa efektywność
# nagród niż 004/006 i brak saturacji; cel 250 może nadal ujawnić zbyt mały zasięg.
# Metryki: sign success, mean signed turn, alignment error, mirror error,
# evaluationRewards, rewardTrend, rewards/1000 drogi, firing i delta wag per most.
# Kryterium odrzucenia: sign success <14/16 dla celu 100; zły znak dla dowolnej
# strony; firing >50 Hz; >10% wag przy 0/50; brak dodatniej mediany 005-006 w
# efektywności nagród lub wynik zależny od jednego seeda.
# Screening: assay 16 seedów przed i po treningu; 60 s x 8 jako sanity check;
# potwierdzenie durationMs=180000, burnInMs=30000, repeats=16, stepMs=1.
# Stan: loader/Agent OK; assay celu 100: 32/32 poprawnych znaków. Dwa niezależne
# bloki 8x60 s dały przewagę nagród i efektywności nad 004/006 bez saturacji.
# Priorytet po long screen Poincaré: nie zwiększać dalej gainu. Najpierw uruchomić
# niezmienione Poincaré 001/002 z learningEnabled true/false; YAML nie koduje
# obecnie tego czynnika, więc musi on pozostać parametrem runnera.
# Aktualizacja: Poincaré001 true-frozen dał +4.0625 nagrody (+21.8%), Poincaré002
# tylko +1.6875 z CI obejmującym zero. Nie eskalować tego YAML przed niezależnym
# potwierdzeniem Poincaré001: 30 seedów od 1000003.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Sensory
        subgroups:
          - name: VisionLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisionCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisionRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Motor
        subgroups:
          - name: TurnLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: TurnRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: OrderedVision
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Sensory
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 8.0

  - name: SensoryBackground
    sensor_type: TONIC_NOISE
    target_group: Cortex.Sensory
    target_type: RS
    params:
      base_current: 1.5
      noise_std: 0.5
      seed: 61001

  - name: MotorExploration
    sensor_type: TONIC_NOISE
    target_group: Cortex.Motor
    target_type: RS
    params:
      base_current: 2.0
      noise_std: 0.7
      seed: 62001

  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Motor.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 3.0

outputs:
  - name: ExplicitTurnLeft
    output_type: TURN_LEFT
    source_group: Cortex.Motor.TurnLeft
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitTurnRight
    output_type: TURN_RIGHT
    source_group: Cortex.Motor.TurnRight
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Motor.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: RS
    to_type: all
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.1
      # Loader ma odwróconą semantykę: true faktycznie blokuje autapsy.
      allow_autapses: true

  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: FS
    to_type: RS
    weight:
      fixed: -2.5
    rule:
      type: fixed_out_degree
      count: 5
      allow_autapses: false

  - from: Cortex.Sensory.VisionLeft
    to: Cortex.Motor.TurnRight
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionCenter
    to: Cortex.Motor.Forward
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionRight
    to: Cortex.Motor.TurnLeft
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false
