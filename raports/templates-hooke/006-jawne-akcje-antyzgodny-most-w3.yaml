# HOOKE 006 — jawne akcje, antyzgodny most o wadze 3 (kontrola znaku)
# Hipoteza: przy tej samej, skutecznej propagacji odwrócenie obu dróg skrętu da
# niezawodnie przeciwny steering gain i obniży efektywność dotarcia do pokarmu.
# Mechanizm matematyczny:
# - N=200 (160 RS, 40 FS), lokalne E oczekiwane 584, I dokładne 200.
# - Most: 640 synaps, fan-in 8, waga 3.0; VisionLeft->TurnLeft i
#   VisionRight->TurnRight, podczas gdy centrum nadal prowadzi do Forward.
# - Próg, prądy, firing, propagacja jednego kroku, STDP 5 ms, eligibility 1000 ms,
#   D-B, Hunger i wszystkie zyski są identyczne z 004/005.
# - To izoluje znak credit assignment: większa aktywność nie może wyjaśnić
#   przewagi 005, jeśli 006 ma ten sam fan-in i amplitudę, lecz obraca od celu.
# Różnica względem baseline: sparse jawne akcje jak 005, ale routing lateralny jest
# celowo błędny; względem 003 jedyną zmianą jest waga 2.0 -> 3.0.
# Oczekiwany wynik: aktywna, lecz przeciwna reakcja dla +/-45 stopni, większa droga
# na nagrodę i mniej rewards/1000 drogi niż 005; ewentualna naprawa przez DA-STDP
# musi odwrócić steering gain i utrzymać się w frozen evaluation.
# Metryki: te same co 005, zwłaszcza sign success liczony względem błędnego prioru,
# sparowane 005-006, rewardTrend oraz zmiany wag obu antyzgodnych mostów.
# Kryterium odrzucenia jako kontroli: brak przeciwnego znaku w >=14/16 prób przed
# treningiem; jako konfigurację użytkową odrzucić bez udokumentowanego odwrócenia
# znaku i dodatniej retencji po zamrożeniu wag. Kryteria saturacji jak w 005.
# Screening: identyczne seedy i czasy jak 004/005; nie interpretować samego ruchu
# ani averageWeightDelta jako naprawy polityki.
# Stan: loader/Agent OK; assay celu 100: 31/32 reakcji od celu. W obu blokach
# 8x60 s kontrola miała niższe nagrody i efektywność drogi niż 005.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Sensory
        subgroups:
          - name: VisionLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisionCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisionRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Motor
        subgroups:
          - name: TurnLeft
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: TurnRight
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: OrderedVision
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Sensory
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 8.0

  - name: SensoryBackground
    sensor_type: TONIC_NOISE
    target_group: Cortex.Sensory
    target_type: RS
    params:
      base_current: 1.5
      noise_std: 0.5
      seed: 61001

  - name: MotorExploration
    sensor_type: TONIC_NOISE
    target_group: Cortex.Motor
    target_type: RS
    params:
      base_current: 2.0
      noise_std: 0.7
      seed: 62001

  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Motor.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 3.0

outputs:
  - name: ExplicitTurnLeft
    output_type: TURN_LEFT
    source_group: Cortex.Motor.TurnLeft
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitTurnRight
    output_type: TURN_RIGHT
    source_group: Cortex.Motor.TurnRight
    source_type: RS
    params:
      radians_per_spike: 0.02

  - name: ExplicitForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Motor.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: RS
    to_type: all
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.1
      # Loader ma odwróconą semantykę: true faktycznie blokuje autapsy.
      allow_autapses: true

  - from: Cortex.[0].[1]
    to: Cortex.[0].[1]
    from_type: FS
    to_type: RS
    weight:
      fixed: -2.5
    rule:
      type: fixed_out_degree
      count: 5
      allow_autapses: false

  - from: Cortex.Sensory.VisionLeft
    to: Cortex.Motor.TurnLeft
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionCenter
    to: Cortex.Motor.Forward
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false

  - from: Cortex.Sensory.VisionRight
    to: Cortex.Motor.TurnRight
    from_type: RS
    to_type: RS
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 8
      allow_autapses: false
