# HIPOTEZA: srednia waga 2.4 zachowa niezawodna propagacje do ruchu, ale ograniczy
# dziesieciokrotnie mniejszy margines napieciowy niz baseline 6.0 i przez to
# zmniejszy saturacje Layer2 bez przejscia do ciszy.
# MECHANIZM MATEMATYCZNY: do przekroczenia separatrix potrzeba ok. 20/2.4 = 9
# niemal synchronicznych spike'ow L1. To nadal silne wspolne wejscie do wszystkich
# 100 neuronow L2, lecz wymaga zdarzenia populacyjnego zamiast 4 spike'ow jak dla
# baseline mean=6. Lokalne E/I, vision, L2->L3 i DA-STDP sa identyczne.
# ROZNICA WZGLEDEM BASELINE: mean/std L1->L2: 6/2 -> 2.4/0.8 (mnoznik 0.4).
# OCZEKIWANY WYNIK: najwyzszy firing i pathLength z serii 001-003, stabilny ruch
# w prawie wszystkich seedach, lecz mozliwe bursty; mniej saturacji niz baseline.
# METRYKI: finalFiringRateHz, pathLength, evaluationRewards, rewardTrend,
# averageWeightDelta; docelowo max A_t, udzial binow A_t/N>0.5 i branching ratio.
# KRYTERIUM ODRZUCENIA: odrzucic jako nadal nadkrytyczny, jesli medianowy firing
# >50 Hz, jesli >10% binow ma aktywne >50% sieci lub jesli srednia zmiana wag
# jest zdominowana przez clipping; odrzucic hipoteze ruchu, jesli pathLength=0
# w ponad 10% seedow albo wynik nie przewyzsza 002.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer2
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer3
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 10.0

outputs:
  - name: MotorControl
    output_type: POPULATION_DRIVE
    source_group: Cortex.Layer3
    source_type: RS
    params:
      speed_per_spike: 0.1
      turn_factor: 0.1

connections:
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 1.0
        max: 2.0
    rule:
      type: probabilistic
      probability: 0.1
      allow_autapses: true

  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 15
      allow_autapses: false

  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal:
        mean: 2.4
        std: 0.8
    rule:
      type: all_to_all
      allow_autapses: false

  - from: Cortex.Layer2
    to: Cortex.Layer3
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal:
        mean: 3.0
        std: 1.0
    rule:
      type: probabilistic
      probability: 0.25
      allow_autapses: false
