# HIPOTEZA: po pilotowym braku ruchu dla mean<=2.4 granica uzytecznej propagacji
# Layer1->Layer2 lezy w przedziale (2.4, 6.0); mean=3.6 jest dolnym punktem
# bisekcji, ktory moze uruchomic Layer3 bez dynamiki baseline.
# MECHANIZM MATEMATYCZNY: separatrix lezy ok. 20 mV nad spoczynkiem. Waga 3.6
# wymaga srednio 6 niemal synchronicznych spike'ow L1 do zainicjowania spike'u L2,
# wobec ok. 4 dla baseline. Pelny fan-out nadal synchronizuje L2; lokalne E/I,
# prady vision, L2->L3 i DA-STDP pozostaja bez zmian.
# ROZNICA WZGLEDEM BASELINE: mean/std L1->L2: 6/2 -> 3.6/1.2 (mnoznik 0.6).
# ROZNICA WZGLEDEM 003: tylko gain L1->L2 rosnie 2.4/0.8 -> 3.6/1.2.
# OCZEKIWANY WYNIK: pojawienie sie ruchu w czesci lub wiekszosci seedow,
# final firing pomiedzy 003 a baseline i mniejsza liczba naglych burstow niz baseline.
# METRYKI: finalFiringRateHz, pathLength, evaluationRewards, rewardTrend,
# averageWeightDelta; docelowo max A_t, m_L1->L2 i rate per warstwa/typ.
# KRYTERIUM ODRZUCENIA: odrzucic jako za slaby, jesli pathLength=0 w >20% seedow;
# odrzucic jako nadkrytyczny, jesli firing >50 Hz lub bursty >50% sieci zajmuja
# >10% binow. Pilot: 10 s, burn-in 2 s, 5 seedow identycznych z 001-003.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer2
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer3
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 10.0}

outputs:
  - name: MotorControl
    output_type: POPULATION_DRIVE
    source_group: Cortex.Layer3
    source_type: RS
    params: {speed_per_spike: 0.1, turn_factor: 0.1}

connections:
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform: {min: 1.0, max: 2.0}
    rule: {type: probabilistic, probability: 0.1, allow_autapses: true}
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight: {fixed: -2.0}
    rule: {type: fixed_out_degree, count: 15, allow_autapses: false}
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 3.6, std: 1.2}
    rule: {type: all_to_all, allow_autapses: false}
  - from: Cortex.Layer2
    to: Cortex.Layer3
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 3.0, std: 1.0}
    rule: {type: probabilistic, probability: 0.25, allow_autapses: false}
