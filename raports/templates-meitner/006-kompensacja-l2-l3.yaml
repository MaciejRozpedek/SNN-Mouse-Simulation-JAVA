# HIPOTEZA: wariant 005 redukuje patologiczny wspolny gain L1->L2, ale traci
# ok. 21% drogi. Selektywne podniesienie gainu L2->L3 o 25% powinno odzyskac
# ruch bez ponownego wzmacniania aktywnosci wszystkich 100 neuronow Layer2.
# MECHANIZM MATEMATYCZNY: L1->L2 pozostaje N(4.8,1.6^2), czyli wymaga ok. 5
# synchronicznych spike'ow L1 do przekroczenia separatrix. Typowy neuron L3 ma
# ok. 20 wejsc z L2; zmiana wagi 3.0->3.75 zmniejsza liczbe jednoczesnych aktywnych
# wejsc potrzebnych do skoku o 20 mV z ok. 7 do ok. 6. To wzmacnia tylko drugi
# stopien propagacji. E/I, vision, lokalne wagi i DA-STDP pozostaja bez zmian.
# ROZNICA WZGLEDEM BASELINE: L1->L2 mean/std 6/2 -> 4.8/1.6; L2->L3
# mean/std 3/1 -> 3.75/1.25. Wzgledem 005 zmienia sie tylko L2->L3 x1.25.
# WYNIK MOTYWUJACY: 30 s x 10 seedow dla 005 dalo rewards 2.3 vs 2.4 baseline,
# path 171.98 vs 218.84 i mediane sparowanej roznicy rewards -0.5.
# OCZEKIWANY WYNIK: pathLength wraca w poblize baseline, mediana sparowanych
# nagrod nie jest ujemna, a final firing i synchronia L2 pozostaja ponizej baseline.
# METRYKI: sparowane evaluationRewards, pathLength, rewards/1000 drogi,
# rewardTrend, finalFiringRateHz, averageWeightDelta; docelowo rate i max A_t L2/L3.
# KRYTERIUM ODRZUCENIA: odrzucic, jesli mediana (rewards_006-rewards_baseline)<0,
# path pozostaje >15% ponizej baseline, firing >50 Hz, albo wzrost nagrod wynika
# tylko z proporcjonalnie dluzszej drogi. Screening musi uzywac tych samych seedow.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer2
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer3
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 10.0}

outputs:
  - name: MotorControl
    output_type: POPULATION_DRIVE
    source_group: Cortex.Layer3
    source_type: RS
    params: {speed_per_spike: 0.1, turn_factor: 0.1}

connections:
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform: {min: 1.0, max: 2.0}
    rule: {type: probabilistic, probability: 0.1, allow_autapses: true}
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight: {fixed: -2.0}
    rule: {type: fixed_out_degree, count: 15, allow_autapses: false}
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 4.8, std: 1.6}
    rule: {type: all_to_all, allow_autapses: false}
  - from: Cortex.Layer2
    to: Cortex.Layer3
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 3.75, std: 1.25}
    rule: {type: probabilistic, probability: 0.25, allow_autapses: false}
