# MEITNER 007 — lokalne hamowanie FS->RS = -3 (prawie rowny bilans lokalny).
# HIPOTEZA: zwiekszenie wyłącznie modulu istniejacych wag FS->RS z 2 do 3
# ograniczy synchroniczne nawroty RS po fali feed-forward, nie odcinajac ruchu.
# MECHANIZM MATEMATYCZNY: typowy RS dostaje lokalnie ok. 7.9 wejsc E o sredniej
# 1.5, czyli 11.85 na jeden synchroniczny spike kazdego zrodla E, oraz 3.75 wejsc
# I. Dla w_I=-3 modul I wynosi 11.25; przy podobnych rates lokalny bilans jest
# bliski 1:1. Hamowanie przychodzi po 1 ms, wiec ma skracac burst, a nie blokowac
# pierwszy feed-forward volley. Prady vision, firing progowy, propagacja L1->L2
# i L2->L3 oraz DA-STDP/credit assignment sa identyczne z baseline. Ujemne wagi
# nie sa plastyczne, wiec zmiana izoluje staly inhibitory gain.
# ROZNICA WZGLEDEM BASELINE: jedyna wartosc funkcjonalna to fixed FS->RS -2 -> -3.
# Liczba neuronow, krawedzi, cele synaps, wszystkie E, prady i outputs sa takie same.
# OCZEKIWANY WYNIK: podobne nagrody i droga, nizsze bursty/koncowy firing oraz
# mniejszy dodatni dryf wag E wskutek ograniczenia korelacji bez utraty propagacji.
# METRYKI: evaluationRewards, sparowane roznice per seed, rewardTrend, pathLength,
# rewards/1000 drogi, finalFiringRateHz, stable-run ratio, averageWeightDelta;
# docelowo max A_t, udzial binow A_t/N>0.5 i firing L1/L2/L3 x RS/FS.
# KRYTERIUM ODRZUCENIA: odrzucic, jesli mediana sparowanych rewards do baseline <0,
# srednia droga spada >15%, >20% runow ma firing poza 0.1-50 Hz albo nie ma zadnego
# sygnalu redukcji aktywnosci/dryfu wag. Screening: 60 s, burn-in 10 s, 12 seedow.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer2
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer3
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 10.0}

outputs:
  - name: MotorControl
    output_type: POPULATION_DRIVE
    source_group: Cortex.Layer3
    source_type: RS
    params: {speed_per_spike: 0.1, turn_factor: 0.1}

connections:
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform: {min: 1.0, max: 2.0}
    rule: {type: probabilistic, probability: 0.1, allow_autapses: true}
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight: {fixed: -3.0}
    rule: {type: fixed_out_degree, count: 15, allow_autapses: false}
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 6.0, std: 2.0}
    rule: {type: all_to_all, allow_autapses: false}
  - from: Cortex.Layer2
    to: Cortex.Layer3
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 3.0, std: 1.0}
    rule: {type: probabilistic, probability: 0.25, allow_autapses: false}
