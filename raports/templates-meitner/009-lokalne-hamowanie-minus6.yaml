# MEITNER 009 — lokalne hamowanie FS->RS = -6 (silne wygaszanie burstow).
# HIPOTEZA: silne I moze ujawnic, czy nagrody baseline pochodza z dlugich lokalnych
# burstow; jesli pojedyncze fale feed-forward wystarcza do sterowania, ruch zostanie,
# lecz aktywnosc wtórna i korelacje DA-STDP wyraznie spadna.
# MECHANIZM MATEMATYCZNY: oczekiwany lokalny impuls na RS to +11.85 od E i -22.5
# od I przy rownych rates. Do sredniego balansu wystarcza r_I/r_E ~=0.527. Taki
# IPSP jest porownywalny z ok. 20 mV odleglosci spoczynku od separatrix, wiec fala
# FS moze cofnac RS do basenu spoczynkowego jeden krok po pobudzeniu. FS nadal nie
# otrzymuje I->I. Prady, feed-forward, pierwszy volley, outputs i DA-STDP sa baseline;
# zmienia sie wylacznie nieplastyczna amplituda lokalnego FS->RS.
# ROZNICA WZGLEDEM BASELINE: jedyna wartosc funkcjonalna to fixed FS->RS -2 -> -6.
# Wzgledem 007/008 jest to dalszy punkt tej samej jednowymiarowej rodziny.
# OCZEKIWANY WYNIK: najnizszy firing i averageWeightDelta, mozliwe runy z bardzo
# mala droga; wariant jest kontrola over-inhibition i powinien wyznaczyc gorna granice.
# METRYKI: evaluationRewards i roznice sparowane, rewardTrend, pathLength,
# rewards/1000 drogi, finalFiringRateHz, stable-run ratio, averageWeightDelta;
# docelowo synchronia A_t, czas burstu i rates RS/FS.
# KRYTERIUM ODRZUCENIA: odrzucic jako over-inhibited, jesli >10% runow nie rusza,
# >20% ma firing <0.1 Hz, droga <85% baseline lub mediana delta rewards <0.
# Screening: 60 s, burn-in 10 s, 12 seedow identycznych z baseline i 007/008.

neuron_types:
  RS: {a: 0.02, b: 0.2, c: -65.0, d: 8.0, v0: -70.0, u0: -14.0}
  FS: {a: 0.1, b: 0.2, c: -65.0, d: 2.0, v0: -70.0, u0: -14.0}

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer2
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}
      - name: Layer3
        neurons:
          - {type: RS, count: 80}
          - {type: FS, count: 20}

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params: {fov: 120, range: 500, overlap_factor: 1.5, max_current: 10.0}

outputs:
  - name: MotorControl
    output_type: POPULATION_DRIVE
    source_group: Cortex.Layer3
    source_type: RS
    params: {speed_per_spike: 0.1, turn_factor: 0.1}

connections:
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform: {min: 1.0, max: 2.0}
    rule: {type: probabilistic, probability: 0.1, allow_autapses: true}
  - from: Cortex.[0]
    to: Cortex.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight: {fixed: -6.0}
    rule: {type: fixed_out_degree, count: 15, allow_autapses: false}
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 6.0, std: 2.0}
    rule: {type: all_to_all, allow_autapses: false}
  - from: Cortex.Layer2
    to: Cortex.Layer3
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      normal: {mean: 3.0, std: 1.0}
    rule: {type: probabilistic, probability: 0.25, allow_autapses: false}
