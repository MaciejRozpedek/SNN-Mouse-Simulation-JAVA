# POINCARE 002 — topograficzne akcje z glodem napedzajacym tylko Forward.
# HIPOTEZA: symetryczny, narastajacy naped populacji Forward zapobiegnie utknięciu
#   bez widocznego celu, a reset po nagrodzie poprawi eksploracje bez dodawania
#   losowego biasu skretu.
# MECHANIZM MATEMATYCZNY: rdzen E/I, propagacja one_to_one i trzy akcje sa takie
#   jak w 001. HUNGER_DRIVE dodaje do 40 RS Forward prad 0 przez 5 s, potem rampa
#   do 2 w 20 s. Bias 3.8 lezy tuz pod reobaza RS I~=4, wiec suma przekracza
#   prog okolo 2 s po rozpoczeciu rampy. Nagroda zeruje dodatkowy naped;
#   DA-STDP nadal przypisuje credit lokalnym sciezkom z eligibility tau=1000 ms.
# ROZNICA WZGLEDEM BASELINE: jawne akcje i rzadka topografia jak w 001 oraz nowy,
#   celowany naped glodu zamiast braku eksploracji; glod nie pobudza kanalow skretu.
# ROZNICA WZGLEDEM 001: jedyna zmiana funkcjonalna to dodatkowy HUNGER_DRIVE.
# OCZEKIWANY WYNIK: wiecej runow z ruchem i nagrodami po dlugiej przerwie, przy
#   zachowaniu symetrii skretu; po posilku chwilowe ograniczenie chaotycznego ruchu.
# METRYKI: evaluationRewards i sparowana roznica do 001, odsetek runow z ruchem,
#   pathLength, rewards/1000 drogi, rewardTrend, finalFiringRateHz,
#   averageWeightDelta oraz rozklad czasu miedzy nagrodami.
# KRYTERIUM ODRZUCENIA: wzrost pathLength bez wzrostu rewards/1000 drogi, mediany
#   nagrod lub trendu; final firing >50 Hz, utrata symetrii albo wynik gorszy od 001
#   na wiekszosci tych samych 16 seedow.
# UWAGA LOADERA: allow_autapses=true celowo blokuje self-edge w aktualnym,
#   odwrotnie zaimplementowanym loaderze.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisualCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisualPositive
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: PositiveTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 6.0
  - name: AssociationBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer2
    target_type: RS
    params:
      base_current: 3.8
      noise_std: 0.0
  - name: ActionBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer3
    target_type: RS
    params:
      base_current: 3.8
      noise_std: 0.0
  - name: HungerForward
    sensor_type: HUNGER_DRIVE
    target_group: Cortex.Layer3.Forward
    target_type: RS
    params:
      activation_delay_ms: 5000
      ramp_duration_ms: 20000
      max_current: 2.0

outputs:
  - name: RotateNegative
    output_type: TURN_RIGHT
    source_group: Cortex.Layer3.NegativeTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: RotatePositive
    output_type: TURN_LEFT
    source_group: Cortex.Layer3.PositiveTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: MoveForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Layer3.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 5.0
    rule:
      type: one_to_one
      allow_autapses: false
  - from: Cortex.Layer2.VisualNegative
    to: Cortex.Layer3.NegativeTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualCenter
    to: Cortex.Layer3.Forward
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualPositive
    to: Cortex.Layer3.PositiveTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 4.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
