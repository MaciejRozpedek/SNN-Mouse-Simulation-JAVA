# POINCARE 006 — slabszy prior przygotowany do testu DA-STDP.
# HIPOTEZA: ogromna przewaga 001 nad baseline pochodzi glownie z jawnej topologii.
#   Obnizenie wag do akcji stworzy headroom: learningEnabled=false zachowa znak,
#   lecz osiagnie mniej nagrod, a true powinno selektywnie wzmocnic przyczynowe drogi.
# MECHANIZM MATEMATYCZNY: Layer1->Layer2, E/I, prady 3.8/3.5, firing i wszystkie
#   populacje pozostaja jak w 001. Kazdy RS akcji nadal ma fixed_in_degree=4,
#   ale waga spada 4 -> 3, wiec maksymalna zgodna paczka daje 12 zamiast 16 mV.
#   Pojedynczy spike 3 mV nie powinien wystarczyc; skorelowane pre-post w odstepie
#   jednego kroku miesci sie w oknie STDP 5 ms, a eligibility 1000 ms czeka na
#   nagrode. Tylko tryb true moze zwiekszac te dodatnie wagi.
# ROZNICA WZGLEDEM BASELINE: rzadka topografia one_to_one i jawne akcje jak 001.
#   Wzgledem 001 jedyna zmiana funkcjonalna to trzy wagi projekcji do akcji 4 -> 3.
# OCZEKIWANY WYNIK: false ma poprawny, ale slabszy prior i mniejszy pierwszy polokres;
#   true daje dodatnie rewards_true-false, dodatni trend difference-in-differences
#   i nie pogarsza efektywnosci drogi ani stabilnosci firing.
# WYNIK MOTYWUJACY: niezalezny P001 true-frozen dal +2.0667 (+10.65%), mediane
#   +1, 17/30 dodatnich, CI [0.2,3.933], dz=.388. Slabszy prior ma sprawdzic,
#   czy wiekszy headroom zwiekszy retencje bez utraty stabilnej polityki.
# METRYKI: surowe pary per seed dla rewards, trendu, pathLength, rewards/1000
#   drogi, firing i averageWeightDelta; osobno pierwsza/druga polowa oraz interakcja
#   (true-false)_006 wzgledem (true-false)_001.
# KRYTERIUM ODRZUCENIA: averageWeightDelta!=0 w false oznacza blad kontroli.
#   Hipoteze uczenia odrzucic, gdy mean lub mediana rewards_true-false <=0,
#   trend DiD <=0, efekt pochodzi z samej dluzszej drogi albo firing traci stabilnosc.
# KONTROLA UCZENIA: learningEnabled jest parametrem runnera, nie YAML. Ten sam plik
#   uruchomic true/false na identycznych seedach; nie dodawac nieznanego klucza YAML.
# PHASE PROTOCOL: po walidacji P001 uzyc duration=300000, freeze=180000,
#   measurementStart/burnIn=185000, repeats=30, step=1 i nowego baseSeed. Porownac
#   always-frozen, train-then-freeze i continuous-learning na identycznych seedach.
# KOLEJNOSC: najpierw wykonac phase protocol na dokladnym P001, dopiero potem 006.

neuron_types:
  RS:
    a: 0.02
    b: 0.2
    c: -65.0
    d: 8.0
    v0: -70.0
    u0: -14.0
  FS:
    a: 0.1
    b: 0.2
    c: -65.0
    d: 2.0
    v0: -70.0
    u0: -14.0

groups:
  - name: Cortex
    subgroups:
      - name: Layer1
        neurons:
          - type: RS
            count: 80
          - type: FS
            count: 20
      - name: Layer2
        subgroups:
          - name: VisualNegative
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: VisualCenter
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: VisualPositive
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
      - name: Layer3
        subgroups:
          - name: NegativeTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5
          - name: Forward
            neurons:
              - type: RS
                count: 40
              - type: FS
                count: 10
          - name: PositiveTurn
            neurons:
              - type: RS
                count: 20
              - type: FS
                count: 5

inputs:
  - name: VisionFront
    sensor_type: GAUSSIAN_VISION
    target_group: Cortex.Layer1
    target_type: RS
    params:
      fov: 120
      range: 500
      overlap_factor: 1.5
      max_current: 6.0
  - name: AssociationBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer2
    target_type: RS
    params:
      base_current: 3.8
      noise_std: 0.0
  - name: ActionBias
    sensor_type: TONIC_NOISE
    target_group: Cortex.Layer3
    target_type: RS
    params:
      base_current: 3.5
      noise_std: 0.0

# Rotacje sa wykonywane przed ruchem, aby przy wspolnej aktywnosci agent najpierw
# zmienil orientacje, a dopiero potem przesunal sie w nowym kierunku.
outputs:
  - name: RotateNegative
    output_type: TURN_RIGHT
    source_group: Cortex.Layer3.NegativeTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: RotatePositive
    output_type: TURN_LEFT
    source_group: Cortex.Layer3.PositiveTurn
    source_type: RS
    params:
      radians_per_spike: 0.02
  - name: MoveForward
    output_type: FORWARD_DRIVE
    source_group: Cortex.Layer3.Forward
    source_type: RS
    params:
      speed_per_spike: 0.05

connections:
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: RS
    to_type: all
    exclude_self: false
    weight:
      uniform:
        min: 0.5
        max: 1.0
    rule:
      type: probabilistic
      probability: 0.08
      allow_autapses: true
  - from: Cortex.Layer1
    to: Cortex.Layer1
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer2.[0]
    to: Cortex.Layer2.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer3.[0]
    to: Cortex.Layer3.[0]
    from_type: FS
    to_type: RS
    exclude_self: false
    weight:
      fixed: -2.0
    rule:
      type: fixed_out_degree
      count: 10
      allow_autapses: false
  - from: Cortex.Layer1
    to: Cortex.Layer2
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 5.0
    rule:
      type: one_to_one
      allow_autapses: false
  - from: Cortex.Layer2.VisualNegative
    to: Cortex.Layer3.NegativeTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualCenter
    to: Cortex.Layer3.Forward
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
  - from: Cortex.Layer2.VisualPositive
    to: Cortex.Layer3.PositiveTurn
    from_type: RS
    to_type: RS
    exclude_self: false
    weight:
      fixed: 3.0
    rule:
      type: fixed_in_degree
      count: 4
      allow_autapses: false
